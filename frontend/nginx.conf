server{
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://aws-eks-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}

# Feature	X-Real-IP (Line 3)	X-Forwarded-For (Line 4)
# Data Format	Single IP address	List of IP addresses
# Primary Use	Authentication, Rate Limiting	Audit trails, Debugging hops
# Reliability	High (set by your Nginx)	Moderate (can be spoofed/long)